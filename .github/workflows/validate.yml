name: Validate generate-presets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-presets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run generate-presets
        run: uv run generate-presets
